version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allinone_backend
    restart: always
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-allinone_super_secret_jwt_and_session_key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-allinone_jwt_secret_key_prod}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/instance/database.sqlite}
      - CORS_ORIGINS=*
      - WATERMARK_TEXT=${WATERMARK_TEXT:-© allinoneblog.dev}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_instance:/app/instance
      - backend_logs:/app/logs
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allinone_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_instance:
  backend_logs:
